services:
  db:
    image: postgres:16-alpine
    container_name: hospital_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_password}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-bookworm-slim
    container_name: hospital_express_api
    restart: unless-stopped
    working_dir: /app
    user: node
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hospital_user}:${POSTGRES_PASSWORD:-hospital_password}@db:5432/${POSTGRES_DB:-hospital_management}
      DATABASE_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
      SOFTWARE_ENGINEER_NAME: ${SOFTWARE_ENGINEER_NAME:-}
      SOFTWARE_ENGINEER_EMAIL: ${SOFTWARE_ENGINEER_EMAIL:-}
      SOFTWARE_ENGINEER_PASSWORD: ${SOFTWARE_ENGINEER_PASSWORD:-}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./prisma.config.js:/app/prisma.config.js:ro
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./database:/app/database:ro
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hospital_pgadmin_gui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

networks:
  default:
    ipam:
      config:
        - subnet: 10.254.254.0/24

volumes:
  postgres_data:
  pgadmin_data:
  api_node_modules:
