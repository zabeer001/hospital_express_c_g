name: node_express_postgres_prod

services:
  db:
    image: postgres:16-alpine
    container_name: prod_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_password}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  api:
    image: node:22-bookworm-slim
    container_name: prod_express_api
    restart: unless-stopped
    working_dir: /app
    user: node
    command: npm start
    volumes:
      # Production files come directly from the checked-out VPS repository.
      # Dependencies live in a persistent volume and are refreshed by the
      # deployment helper only when package or Prisma inputs change.
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./prisma.config.js:/app/prisma.config.js:ro
      - ./prisma:/app/prisma:ro
      - ./src:/app/src:ro
      - ./database:/app/database:ro
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hospital_user}:${POSTGRES_PASSWORD:-hospital_password}@db:5432/${POSTGRES_DB:-hospital_management}
      DATABASE_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      SOFTWARE_ENGINEER_NAME: ${SOFTWARE_ENGINEER_NAME:-}
      SOFTWARE_ENGINEER_EMAIL: ${SOFTWARE_ENGINEER_EMAIL:-}
      SOFTWARE_ENGINEER_PASSWORD: ${SOFTWARE_ENGINEER_PASSWORD:-}
    ports:
      - "127.0.0.1:${PORT}:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: prod_pgadmin_gui
    profiles:
      - admin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.254.253.0/24

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  api_node_modules:
    driver: local
